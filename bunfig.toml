[install]
# Use exact versions for reproducible installs
exact = true

[test]
# `references/` mirrors upstream repos for code reference (e.g. `references/effect/`).
# Their *.test.ts files depend on devDeps we don't install, so without this prune
# `bun test` from the repo root produces ~870 import failures and appears to hang.
# Requires Bun >= 1.3.13 (oven-sh/bun#28089).
pathIgnorePatterns = ["references/**"]
